function oct(g,x,y,r,c){g.fillStyle=c;g.beginPath();for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}g.fill()}

function solid(x,y){const r=grid[y];if(!r)return true;const c=r[x];return c===undefined||c!=='.'}
function blocked(x,y,r){return solid((x-r)|0,(y-r)|0)||solid((x+r)|0,(y-r)|0)||solid((x-r)|0,(y+r)|0)||solid((x+r)|0,(y+r)|0)}
function move(o,mx,my,r){if(!blocked(o.x+mx,o.y,r))o.x+=mx;if(!blocked(o.x,o.y+my,r))o.y+=my}
function cast(x,y,dx,dy){
 let mx=x|0,my=y|0;const ddx=Math.abs(1/dx),ddy=Math.abs(1/dy);let sx,sy,sdx,sdy,side=0;
 if(dx<0){sx=-1;sdx=(x-mx)*ddx}else{sx=1;sdx=(mx+1-x)*ddx}
 if(dy<0){sy=-1;sdy=(y-my)*ddy}else{sy=1;sdy=(my+1-y)*ddy}
 for(let i=0;i<96;i++){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}if(solid(mx,my))return{d:side?sdy-ddy:sdx-ddx,mx,my,side}}

}

  const cx=2*x/W-1,rx=dX+pX*cx,ry=dY+pY*cx,r=cast(P.x,P.y,rx,ry),d=Math.max(r.d,.05);
  zbuf[x]=d;const lh=VH/d,top=HALF-lh/2,y0=Math.max(0,top|0),y1=Math.min(VH,(HALF+lh/2)|0);

  for(let y=y0;y<y1;y++){buf[y*W+x]=shade(T[(((tp|0)&63)<<6)|tx],f);tp+=st}
 }
 const S=[];
 for(const e of mobs){const T=TY[e.t];if(T.flick&&!e.dead&&Math.random()<.25)continue;S.push({x:e.x,y:e.y,tex:e.dead?T.fx.dead:e.atk>0?T.fx.atk:T.fx.walk[(e.anim|0)&1],sc:T.sc,lift:0,fl:e.pain>0&&!e.dead})}

 if(thomas)S.push({x:thomas.x,y:thomas.y,tex:THOMAS[(time*1.5|0)&1],sc:.9,lift:0});
 for(const p of projs)S.push({x:p.x,y:p.y,tex:p.tex,sc:p.sc,lift:.35});
 for(const s of S)s.d=(s.x-P.x)**2+(s.y-P.y)**2;

  const sx=s.x-P.x,sy=s.y-P.y,tX=inv*(dY*sx-dX*sy),tY=inv*(-pY*sx+pX*sy);
  if(tY<=.1)continue;

  const x0=Math.max(0,left|0),x1=Math.min(W,(scr+h/2)|0),y0=Math.max(0,top|0),y1=Math.min(VH,bottom|0),f=fog(tY),px=s.tex.px;
  for(let x=x0;x<x1;x++){
   if(tY>=zbuf[x])continue;const tx=(((x-left)*64/h)|0)&63;
   for(let y=y0;y<y1;y++){const c=px[((((y-top)*64/h)|0)&63)<<6|tx];if((c>>>24)<128)continue;buf[y*W+x]=s.fl?bright(c):shade(c,f)}
  }
 }

function fire(){
 const w=WEAP[P.weapon];if(P.cd>0)return;
 if(P.ammo<w.a){P.cd=.4;sfx('click');msg('Plus de breakpoints !',1.5);return}
 P.ammo-=w.a;P.cd=w.cd;P.fireT=.12;sfx(w.snd);
 for(const e of mobs)if(!e.dead){const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<5||(d<10&&los(e.x,e.y,P.x,P.y)))e.alert=true}
 for(let i=0;i<w.p;i++){
  const a=P.a+(Math.random()-.5)*2*w.s,dx=Math.cos(a),dy=Math.sin(a);
  let bd=cast(P.x,P.y,dx,dy).d,best=null,hitT=false;
  const test=(x,y,r)=>{const ex=x-P.x,ey=y-P.y,al=ex*dx+ey*dy;return al>0&&al<bd&&Math.abs(ex*dy-ey*dx)<r?al:0};
  for(const e of mobs){if(e.dead)continue;const al=test(e.x,e.y,.3*TY[e.t].sc+.06);if(al){bd=al;best=e;hitT=false}}
  if(thomas){const al=test(thomas.x,thomas.y,.3);if(al){best=null;hitT=true}}
  if(best)hurtMob(best,w.d[0]+Math.random()*(w.d[1]-w.d[0]));
  if(hitT&&L.shotT<=0){msg('Thomas : « On tire sur les bugs, pas sur le mainteneur. »',4);L.shotT=4}
 }
}

function update(dt){
 L.time+=dt;L.intro-=dt;L.shotT-=dt;
 P.cd-=dt;P.fireT-=dt;P.hurtT-=dt;P.grinT-=dt;P.pickT-=dt;
 P.a+=((K.ArrowRight?1:0)-(K.ArrowLeft?1:0))*2.4*dt;
 const fw=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0),st=(K.KeyD?1:0)-(K.KeyA?1:0);
 const sp=(K.ShiftLeft||K.ShiftRight?5.2:3.2)*dt,dx=Math.cos(P.a),dy=Math.sin(P.a);
 let mx=dx*fw-dy*st,my=dy*fw+dx*st;const ml=Math.hypot(mx,my);
 if(ml>0){move(P,mx/ml*sp,my/ml*sp,.25);P.bob+=dt*8;P.moving=Math.min(1,P.moving+dt*6)}else P.moving=Math.max(0,P.moving-dt*6);
 if(mouseDown)fire();
 for(const it of items)if(!it.taken&&Math.hypot(it.x-P.x,it.y-P.y)<.55)take(it);
 for(const e of mobs){
  if(e.dead)continue;const T=TY[e.t];e.pain-=dt;e.atk-=dt;e.cd-=dt;
  const ex=P.x-e.x,ey=P.y-e.y,d=Math.hypot(ex,ey),sees=d<16&&los(e.x,e.y,P.x,P.y);
  if(!e.alert){if(sees&&d<11){e.alert=true;e.cd=.4+Math.random()}else continue}
  if(e.pain>0)continue;
  if(T.ranged&&sees&&d<12&&d>1&&e.cd<=0){shoot(e,T);e.cd=T.rate*(.6+Math.random()*.8);e.atk=.35}
  if(T.melee&&d<.95&&e.cd<=0){hurtPlayer(T.dmg);e.cd=T.rate;e.atk=.3}
  const keep=T.melee?.75:(sees?T.keep:.8);
  if(d>keep&&e.atk<=0){let ux=ex/d,uy=ey/d;if(T.flick){const j=Math.sin(time*6+e.anim*3)*.8;ux-=uy*j;uy+=ex/d*j}const n=Math.hypot(ux,uy);move(e,ux/n*T.sp*dt,uy/n*T.sp*dt,.25);e.anim+=dt*T.sp*2}
 }
 for(let i=0;i<mobs.length;i++)for(let j=i+1;j<mobs.length;j++){const a=mobs[i],b=mobs[j];if(a.dead||b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<.5&&d>0){const p=(.5-d)/2/d;move(a,-dx*p,-dy*p,.25);move(b,dx*p,dy*p,.25)}}
 for(const p of projs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(solid(p.x|0,p.y|0))p.life=0;else if(Math.hypot(p.x-P.x,p.y-P.y)<.35){hurtPlayer(p.dmg);p.life=0}}
 projs=projs.filter(p=>p.life>0);
 for(const m of msgs)m.t-=dt;msgs=msgs.filter(m=>m.t>0);
}

 const rows=grid.length,cols=grid[0].length,s=Math.min(4,130/cols),ox=W-cols*s-4,oy=4;
 ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(ox-2,oy-2,cols*s+4,rows*s+4);
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const c=grid[y][x];if(c==='.')continue;ctx.fillStyle=c==='D'?'#e8b820':c==='X'?'#3f6':'#8a8f98';ctx.fillRect(ox+x*s,oy+y*s,s,s)}
 ctx.fillStyle='#f33';for(const e of mobs)if(!e.dead)ctx.fillRect(ox+e.x*s-1,oy+e.y*s-1,2,2);
 if(thomas){ctx.fillStyle='#f0a030';ctx.fillRect(ox+thomas.x*s-1,oy+thomas.y*s-1,3,3)}
 ctx.fillStyle='#fff';ctx.fillRect(ox+P.x*s-1,oy+P.y*s-1,3,3);ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(ox+P.x*s,oy+P.y*s);ctx.lineTo(ox+(P.x+Math.cos(P.a)*2)*s,oy+(P.y+Math.sin(P.a)*2)*s);ctx.stroke();
}
function shadowTxt(s,x,y,font,col,al){txt(ctx,s,x+1,y+1,font,'#000',al);txt(ctx,s,x,y,font,col,al)}
function drawPlayOverlay(){
 drawWeapon();
 ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(W/2-4,HALF,3,1);ctx.fillRect(W/2+2,HALF,3,1);ctx.fillRect(W/2,HALF-4,1,3);ctx.fillRect(W/2,HALF+2,1,3);
 if(P.hurtT>0){ctx.fillStyle=`rgba(255,0,0,${P.hurtT*1.2})`;ctx.fillRect(0,0,W,VH)}
 if(P.pickT>0){ctx.fillStyle='rgba(255,220,80,.25)';ctx.fillRect(0,0,W,VH)}
 let my=6;
 if(thomas&&Math.hypot(thomas.x-P.x,thomas.y-P.y)<2.6&&los(P.x,P.y,thomas.x,thomas.y)){
  const lines=L.def.thomas,i=((time/3)|0)%lines.length;
  ctx.fillStyle='rgba(10,12,18,.85)';ctx.fillRect(8,6,W-16,34);ctx.fillStyle='#f0a030';ctx.fillRect(8,6,3,34);
  txt(ctx,'THOMAS DE GRIVEL · kmx.io',18,15,'bold 8px monospace','#f0a030','left');txt(ctx,lines[i],18,29,'bold 10px monospace','#fff','left');my=46;
 }
 for(const m of msgs){ctx.globalAlpha=Math.min(1,m.t);shadowTxt(m.s,8,my+4,'bold 8px monospace','#ffd23a','left');my+=11}
 ctx.globalAlpha=1;
 if(showMap)drawMap();
 if(L.intro>0){ctx.globalAlpha=Math.min(1,L.intro);shadowTxt(L.def.name,W/2,HALF-20,'bold 22px monospace','#e0321c');shadowTxt(L.def.sub,W/2,HALF+4,'bold 10px monospace','#fff');ctx.globalAlpha=1}
}
function panel(){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,H)}
function blink(s,y){if((time*2|0)%2)shadowTxt(s,W/2,y,'bold 10px monospace','#ffd23a')}
function fmt(t){t=t|0;return(t/60|0)+':'+String(t%60).padStart(2,'0')}
function pct(a,b){return b?Math.round(a*100/b)+'%':'—'}
function drawOverlay(){
 if(state==='title'){
  panel();txt(ctx,'KMX DOOM',W/2+3,58,'bold 46px Impact, monospace','#400');txt(ctx,'KMX DOOM',W/2,55,'bold 46px Impact, monospace','#e0321c');
  txt(ctx,'— LE STAGE —',W/2,90,'bold 13px monospace','#ffd23a');txt(ctx,'un FPS en un seul fichier · kmx.io · 2026',W/2,106,'9px monospace','#bbb');
  const c=['ZQSD / WASD : bouger     Souris : viser','Clic : tirer     E / Espace : ouvrir, git push','1 2 3 : printf, gdb, ASan     Shift : courir','M / Tab : carte     Échap : pause'];
  c.forEach((s,i)=>txt(ctx,s,W/2,138+i*13,'8px monospace','#ddd'));blink('CLIQUE POUR COMMENCER',215);
 }else if(state==='pause'){panel();shadowTxt('PAUSE',W/2,100,'bold 30px monospace','#e0321c');blink('clique pour reprendre',140)}
 else if(state==='dead'){ctx.fillStyle='rgba(120,0,0,.6)';ctx.fillRect(0,0,W,H);shadowTxt('Segmentation fault',W/2,90,'bold 22px monospace','#fff');shadowTxt('(core dumped)',W/2,116,'bold 12px monospace','#fcc');if(stateT>.8)blink('clique pour relancer le niveau',160)}
 else if(state==='inter'){
  panel();shadowTxt('NIVEAU TERMINÉ',W/2,40,'bold 22px monospace','#e0321c');shadowTxt(L.def.name,W/2,64,'bold 11px monospace','#fff');
  const r=[['Bugs fixés',pct(L.kills,L.total)],['Facts',pct(L.facts,L.ftotal)],['Temps',fmt(L.time)]];
  r.forEach(([a,b],i)=>{txt(ctx,a,W/2-80,94+i*16,'bold 10px monospace','#ddd','left');txt(ctx,b,W/2+80,94+i*16,'bold 10px monospace','#ffd23a','right')});
  shadowTxt('Thomas : '+L.def.outro,W/2,160,'bold 9px monospace','#f0a030');if(stateT>.8)blink('clique pour continuer',200);
 }else if(state==='win'){
  panel();txt(ctx,'STAGE VALIDÉ',W/2,50,'bold 30px Impact, monospace','#3f6');
  shadowTxt('Thomas : « Commit validé. Une ligne, sans corps. »',W/2,84,'bold 9px monospace','#f0a030');
  const r=[['Bugs fixés',G.kills+'/'+G.total],['Facts',G.facts+'/'+G.ftotal],['Temps total',fmt(G.time)]];
  r.forEach(([a,b],i)=>{txt(ctx,a,W/2-80,112+i*15,'bold 10px monospace','#ddd','left');txt(ctx,b,W/2+80,112+i*15,'bold 10px monospace','#ffd23a','right')});
  shadowTxt('Merci Thomas, merci kmx.io.',W/2,170,'bold 10px monospace','#fff');shadowTxt('Reste plus qu\'à écrire le rapport de stage...',W/2,186,'9px monospace','#bbb');
  if(stateT>1.2)blink('clique pour revenir au titre',220);
 }
}

function newGame(){P=newPlayer();G={kills:0,total:0,facts:0,ftotal:0,time:0};loadLevel(0);snap=snapshot();setState('play')}
function restart(){Object.assign(P,snap,{owned:snap.owned.slice(),hp:Math.max(snap.hp,50)});loadLevel(li);setState('play')}
function nextLevel(){loadLevel(li+1);snap=snapshot();setState('play')}
function lock(){try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
function click(){
 if(stateT<.5)return;
 if(state==='title'){newGame();lock()}
 else if(state==='pause'){setState('play');lock()}
 else if(state==='inter'){nextLevel();lock()}
 else if(state==='dead'){restart();lock()}
 else if(state==='win'){P=newPlayer();loadLevel(0);setState('title')}
}

const K={};
addEventListener('keydown',e=>{
 K[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();
 audioInit();if(state!=='play'){if(e.code==='Enter'||e.code==='Space')click();return}
 if(e.code==='KeyE'||e.code==='Space')use();
 const n=['Digit1','Digit2','Digit3'].indexOf(e.code);if(n>=0&&P.owned[n])P.weapon=n;
 if(e.code==='KeyM'||e.code==='Semicolon'||e.code==='Tab')showMap=!showMap;
});
addEventListener('keyup',e=>{K[e.code]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false;mouseDown=false});
addEventListener('mousemove',e=>{if(state==='play'&&document.pointerLockElement===cv)P.a+=e.movementX*.0026});
addEventListener('wheel',e=>{if(state!=='play')return;for(let i=1;i<=3;i++){const n=(P.weapon+(e.deltaY>0?i:3-i))%3;if(P.owned[n]){P.weapon=n;break}}});
cv.addEventListener('mousedown',e=>{audioInit();if(state==='play'){if(document.pointerLockElement!==cv)lock();if(e.button===0)mouseDown=true;return}click()});
addEventListener('mouseup',()=>{mouseDown=false});
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==cv&&state==='play'){mouseDown=false;setState('pause')}});

let AC=null,NB=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate/2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(type,f0,f1,dur,vol){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur)}
function noiz(dur,vol,freq){const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur)}
function sfx(n){
 if(!AC)return;
 switch(n){
  case'pistol':noiz(.15,.5,3000);tone('square',400,80,.1,.12);break;
  case'shotgun':noiz(.4,.8,1500);tone('sawtooth',150,40,.3,.2);break;
  case'chain':noiz(.07,.3,4000);break;
  case'hit':tone('square',300,120,.08,.08);break;
  case'die':tone('sawtooth',400,40,.5,.18);break;
  case'hurt':tone('square',120,60,.2,.2);break;
  case'pick':tone('square',600,1200,.12,.1);break;
  case'door':tone('sawtooth',80,50,.5,.18);noiz(.4,.15,400);break;
  case'fire':tone('sawtooth',700,200,.2,.07);break;
  case'click':tone('square',900,900,.03,.06);break;
  case'win':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone('square',f,f,.18,.1),i*140));break;
 }
}

function loadImg(src,cb){if(!src)return;const i=new Image();i.crossOrigin='anonymous';i.onload=()=>cb(i);i.src=src}
loadImg(ASSETS.thomasFace,i=>{try{THOMAS=[thomasTex(0,i),thomasTex(1,i)]}catch(e){}});
loadImg(ASSETS.playerFace,i=>{FACE=i});

P=newPlayer();loadLevel(0);
let last=performance.now();
function frame(now){
 const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;time+=dt;stateT+=dt;
 if(state==='play')update(dt);else if(state==='title')P.a+=dt*.2;
 render();
 if(state!=='title'){drawPlayOverlay();drawHUD()}
 drawOverlay();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

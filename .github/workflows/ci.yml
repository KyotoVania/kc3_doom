name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native tests (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang pkg-config libcairo2-dev
      - run: sh tests/run_native.sh
        env:
          CC: ${{ matrix.cc }}

  site:
    name: Presentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'site_test.py' -v
      - run: python3 tools/build_site.py --output _site --repository "$SITE_REPOSITORY" --revision "$SITE_REVISION"
        env:
          SITE_REPOSITORY: ${{ github.repository }}
          SITE_REVISION: ${{ github.sha }}
      - run: python3 -c 'import re, pathlib; print("\n".join(re.findall(r"<script>(.*?)</script>", pathlib.Path("_site/index.html").read_text(), re.S)))' | node --check

  pages:
    name: Publish presentation
    needs: [native, site]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/configure-pages@v5
      - run: python3 tools/build_site.py --output _site --repository "$SITE_REPOSITORY" --revision "$SITE_REVISION"
        env:
          SITE_REPOSITORY: ${{ github.repository }}
          SITE_REVISION: ${{ github.sha }}
      - name: Update gh-pages branch
        run: sh tools/publish_site.sh _site
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Read published branch
        run: |
          mkdir _published
          git archive FETCH_HEAD | tar -x -C _published
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _published
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
